name: CI - tests and quality checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Install project deps if present
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi

          # CI tooling
          pip install pytest pytest-cov ruff nbformat nbclient

      - name: Lint Python files
        run: |
          ruff check src tests --select E9,F63,F7,F82 --output-format=github

      - name: Run unit tests
        run: |
                 python -m pytest -q tests --maxfail=1 --disable-warnings --cov=src --cov-report=term-missing
      - name: Validate notebooks can be parsed (fast check)
        run: |
          python - << 'PY'
          import os
          import nbformat

          bad = []
          for root, _, files in os.walk("."):
              if any(x in root for x in [".git", ".venv", "__pycache__", ".ipynb_checkpoints"]):
                  continue
              for f in files:
                  if f.endswith(".ipynb"):
                      p = os.path.join(root, f)
                      try:
                          nbformat.read(p, as_version=4)
                      except Exception as e:
                          bad.append((p, str(e)))

          if bad:
              for p, e in bad:
                  print(f"FAILED NOTEBOOK PARSE: {p}\n  {e}")
              raise SystemExit(1)
          print("Notebook parse check passed.")
          PY
