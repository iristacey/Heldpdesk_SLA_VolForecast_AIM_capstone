 name: Project contract tests

 on:
   push:
   pull_request:

 jobs:
+  lint:
+    runs-on: ubuntu-latest
+    steps:
+      - uses: actions/checkout@v4
+      - uses: actions/setup-python@v5
+        with:
+          python-version: "3.12"
+          cache: pip
+      - name: Install linting tools
+        run: python -m pip install --upgrade pip ruff
+      - name: Check Python syntax and undefined names
+        run: |
+          python -m py_compile src/*.py
+          ruff check --select E9,F63,F7,F82 src tests
+
   test:
+    needs: lint
     runs-on: ubuntu-latest
     steps:
-      - uses: actions/checkout@v5
-      - uses: actions/setup-python@v6
+      - uses: actions/checkout@v4
+      - uses: actions/setup-python@v5
         with:
           python-version: "3.12"
+          cache: pip
       - name: Install test dependencies
         run: python -m pip install -r requirements-test.txt
       - name: Run project contract tests
         run: python -m unittest discover -s tests -v

   docker:
     runs-on: ubuntu-latest
     needs: test
     steps:
-      - uses: actions/checkout@v5
+      - uses: actions/checkout@v4
       - name: Build test image
         run: docker build -t issues-capstone .
       - name: Run project contract tests in container
         run: docker run --rm issues-capstone
+
+  api-smoke-test:
+    runs-on: ubuntu-latest
+    needs: docker
+    steps:
+      - uses: actions/checkout@v4
+      - name: Build analysis image with full dependencies
+        run: docker build --target analysis -t issues-capstone-api .
+      - name: Start API container
+        run: |
+          docker run --detach \
+            --name issues-capstone-api \
+            --publish 8000:8000 \
+            issues-capstone-api \
+            python -m uvicorn src.app:app --host 0.0.0.0 --port 8000
+      - name: Wait for API to be ready and verify /health endpoint
+        run: |
+          for attempt in {1..30}; do
+            if curl --fail --silent http://127.0.0.1:8000/health; then
+              echo "API is healthy"
+              exit 0
+            fi
+            echo "Attempt $attempt/30: waiting for API..."
+            sleep 2
+          done
+          echo "API health check failed"
+          docker logs issues-capstone-api
+          exit 1
+      - name: Test /model/metadata endpoint
+        run: |
+          curl --fail --silent http://127.0.0.1:8000/model/metadata | jq .
+      - name: Stop API container
+        if: always()
+        run: docker rm --force issues-capstone-api || true
