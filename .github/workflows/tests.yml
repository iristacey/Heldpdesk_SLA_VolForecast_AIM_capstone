name: Project contract tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install Ruff
        run: python -m pip install ruff==0.16.9
      - name: Check Python syntax and undefined names
        run: |
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run project contract tests
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: [static-analysis, test]
    steps:
      - uses: actions/checkout@v5
      - name: Build test image
        run: docker build -t issues-capstone .
      - name: Run project contract tests in container
        run: docker run --rm issues-capstone

  api-smoke-test:
    runs-on: ubuntu-latest
    needs: [static-analysis, test]
    steps:
      - uses: actions/checkout@v5
      - name: Build analysis image
        run: docker build --target analysis -t issues-capstone-api .
      - name: Start API container
        run: |
          docker run --detach \
            --name issues-capstone-api \
            --publish 127.0.0.1:8000:8000 \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/output,target=/app/output,readonly" \
            issues-capstone-api \
            python -m uvicorn src.app:app --host 0.0.0.0 --port 8000
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health --output /dev/null; then
              echo "API is ready"
              exit 0
            fi
            if [[ "$(docker inspect --format='{{.State.Running}}' issues-capstone-api)" != "true" ]]; then
              echo "API container stopped before becoming ready"
              docker logs issues-capstone-api
              exit 1
            fi
            echo "Attempt ${attempt}/30: waiting for API"
            sleep 2
          done
          echo "API did not become ready"
          docker logs issues-capstone-api
          exit 1
      - name: Verify health endpoint
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health |
            python -c 'import json, sys; health = json.load(sys.stdin); assert health["status"] == "ok"; assert health["model_name"]'
      - name: Verify model metadata endpoint
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/model/metadata |
            python -c 'import json, sys; metadata = json.load(sys.stdin); assert metadata["model_name"]; assert metadata["trained_on_date_end"]'
      - name: Verify persisted forecast endpoint
        run: |
          curl --fail --silent --show-error "http://127.0.0.1:8000/forecast?horizon_days=1" |
            python -c 'import json, sys; forecast = json.load(sys.stdin); assert len(forecast["forecast"]) == 1'
      - name: Stop API container
        if: always()
        run: docker rm --force issues-capstone-api 2>/dev/null || true
