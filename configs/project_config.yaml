project_name: Help Desk Ticket SLA and Volume Forecasting
project_goal: "Analyze documented help-desk Ticket records, retrospectively compare calendar resolution duration with project-configured priority SLA references, and compare seven-day and 30-day daily ticket-arrival forecasts."
dataset: data/raw/issues.csv
dataset_source:
  title: "Help Desk Tickets"
  publisher: Mendeley Data
  url: "https://data.mendeley.com/datasets/btm76zndnt/2"
  citation_note: "Mohammad Abdellatif (2025), Help Desk Tickets, version 2, published 30 May 2025, DOI 10.17632/btm76zndnt.2, CC BY 4.0. Local issues.csv matches Mendeley v2 published SHA256/size and a fresh Kaggle v1 download as recorded in data/source_verification.json on 2026-09-30. Kaggle's CC0 label conflicts with original CC BY 4.0; retain original attribution and resolve the mirror label. Coverage, date-range interpretation and privacy review remain open."
  local_file_match_verified: true
  identity_verification_record: data/source_verification.json
dataset_documentation: "Downloads/Help Desk Tickets/Help Desk Tickets/FEATURES.md and EXAMPLE.md"
project_workstreams:
  - id: retrospective_priority_sla_assessment
    role: core_descriptive_workstream
    target: "Elapsed wall-clock hours from issue_created to issue_resolution_date compared with configured reference by mapped issue_priority"
  - id: daily_ticket_volume_forecasting
    role: core_predictive_workstream
    target: "Count of issue_type=Ticket records by issue_created calendar day"

analysis_scope:
  documented_start_date: "2016-01-01"
  issue_type: Ticket
  note: "The source documentation describes issues.csv as January 2016–March 2023, although issue_created contains earlier records. Pre-2016 records are profiled and excluded from the primary analysis."
  complete_daily_coverage: true
  coverage_assumption: "The CSV is treated as a complete issue-record extract for the documented analysis period; dates without a Ticket row are zero-arrival dates. Completeness is not independently verified."

priority_sla_assessment:
  primary: true
  priority_field: issue_priority
  resolution_duration_field: elapsed_wall_clock_hours
  priority_mapping:
    Blocker: Critical
    Highest: Critical
    High: High
    Medium: Medium
    Low: Low
    Lowest: Low
  excluded_priority_values:
    - unknown
  reference_targets_hours:
    Critical: 4
    High: 8
    Medium: 24
    Low: 24
  target_basis: "Project-configured references carried forward from the prior project; not independently verified service policy."
  applicability_status: "Not policy-validated. Priority mapping and target applicability require service-owner confirmation."
  retrospective_cohort:
    issue_type: Ticket
    documented_start_date: "2016-01-01"
    resolution_outcome: Done
    require_known_mapped_priority: true
    require_valid_nonnegative_elapsed_duration: true
  duration_definition: "Calendar wall-clock hours: issue_resolution_date minus issue_created; not a confirmed business-hours/pause-adjusted SLA clock."
  alternative_duration_field: "wf_total_time seconds is reported only as a workflow-processing-time comparison, not substituted for elapsed resolution duration."

ticket_volume_forecasting:
  enabled: true
  project_role: core_predictive_workstream
  target: "count of issue_type=Ticket records by issue_created calendar day"
  source_date_column: issue_created
  frequency: daily
  timezone: UTC
  intended_planning_horizon_days: 30
  evaluation_horizons_days:
    - 7
    - 30
  weekly_seasonal_period_days: 7
  initial_training_days: 365
  validation_days: 365
  final_test_days: 365
  rolling_origin_stride_days: 7
  complete_daily_coverage: true
  evaluation:
    method: expanding_window_rolling_origin
    horizon_days: 30
    validation_metric: MAE
    model_selection: "Lowest validation MAE; final test kept separate until selection is fixed."
    report_metrics:
      - MAE
      - RMSE
      - WAPE
      - sMAPE
    uncertainty: "Symmetric 90% empirical absolute-error interval calibrated on validation residuals; test coverage is reported and does not guarantee future calibration."
  models:
    - seasonal_naive_lag_7
    - ets_additive_weekly
    - xgboost_autoregression_lags_1_to_28
    - ridge_mutual_information_selection_pca
  feature_lags_days: 28
  pca_explained_variance: 0.95
  selected_feature_count: 10
  xgboost:
    objective: reg:squarederror
    n_estimators: 200
    max_depth: 3
    learning_rate: 0.04
    min_child_weight: 3
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 5.0
    random_state: 42
    n_jobs: 1
  ets:
    trend: additive
    seasonal: additive
  output_directory: output/issue_helpdesk/volume_forecast
  deployment_status: research_demonstration_historical_source
